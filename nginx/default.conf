# JSON-RPC calls are inspected by rpc_filter.js before they reach Geth
# (see that file for the allowlist). The njs module is loaded in nginx/Dockerfile.
js_import rpc from /etc/nginx/njs/rpc_filter.js;

server {
    listen 80;

    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # The filter reads the whole body in memory; keep buffer and limit equal
    # so large contract deployments are not spilled to a temp file.
    client_max_body_size 2m;
    client_body_buffer_size 2m;
    # Only mixed batches (some calls answered locally) use a buffered
    # subrequest; everything else is internally redirected and streamed.
    subrequest_output_buffer_size 8m;

    # Our CORS headers on every answer, including filtered and redirected ones.
    # Locations below must not define add_header, or these stop applying.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

    location / {
        # 1. Handle Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 2. Inspect JSON-RPC methods, forward allowed calls to /_geth
        js_content rpc.filter;
    }

    location = /_geth {
        internal;

        # Proxy using a variable for dynamic resolution
        # This prevents Nginx from crashing if 'geth' is not found at startup
        set $upstream_geth http://geth:8545/;
        proxy_pass $upstream_geth;

        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Content-Type application/json;
        proxy_pass_request_headers off;

        # STRIP Upstream CORS Headers
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
    }
}
